name: Build & Sign PDFix Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Vendor OCR Engine
        run: npm run vendor:ocr

      - name: Build Web Assets
        run: npm run build

      - name: Strip unused bundled qpdf wasm
        run: rm -f dist/assets/qpdf-*.wasm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build PDFix APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release-unsigned.apk ../pdfix-global-unsigned.apk

      - name: Build PDFix Lite APK (No OCR)
        run: |
          rm -rf public/tesseract/
          rm -rf public/qpdf/

          export VITE_DISABLE_OCR=true
          export VITE_DISABLE_UNLOCK_WASM=true
          npm run build
          rm -f dist/assets/qpdf-*.wasm
          npx cap sync android

          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release-unsigned.apk ../pdfix-lite-unsigned.apk

      - name: Sign Both APKs
        id: sign_app
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: .
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: "34.0.0"

      - name: Rename & Prepare Artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp pdfix-global-unsigned-signed.apk "pdfix-v${VERSION}.apk"
          cp pdfix-lite-unsigned-signed.apk "pdfix-lite-v${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFix-v${{ env.APP_VERSION }}
          path: pdfix-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload Lite APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFix-lite-v${{ env.APP_VERSION }}
          path: pdfix-lite-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error